<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050914;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a1628;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8f4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7bb8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#64d9ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f8cff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#64d9ff;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle grid lines -->
  <g stroke="rgba(79,140,255,0.06)" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Radial glow -->
  <radialGradient id="glow" cx="30%" cy="50%" r="50%">
    <stop offset="0%" style="stop-color:rgba(43,116,255,0.18);stop-opacity:1"/>
    <stop offset="100%" style="stop-color:rgba(43,116,255,0);stop-opacity:1"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Avatar placeholder square -->
  <rect x="80" y="165" width="160" height="160" rx="20"
        fill="none" stroke="rgba(112,220,255,0.45)" stroke-width="2"/>
  <text x="160" y="258" text-anchor="middle"
        font-family="ui-monospace,monospace" font-size="48"
        font-weight="800" fill="rgba(100,217,255,0.6)">GG</text>

  <!-- Accent line below avatar -->
  <rect x="80" y="340" width="160" height="2" fill="url(#accentLine)" rx="1"/>

  <!-- Name -->
  <text x="280" y="250" font-family="system-ui,-apple-system,sans-serif"
        font-size="68" font-weight="800" letter-spacing="-1"
        fill="url(#nameGrad)">Gourab Ganguly</text>

  <!-- Title -->
  <text x="280" y="305" font-family="system-ui,-apple-system,sans-serif"
        font-size="28" font-weight="600" letter-spacing="0.02em"
        fill="#70dcff">Software Developer · SDE-1 @ Ancile</text>

  <!-- Divider -->
  <rect x="280" y="330" width="580" height="1" fill="rgba(126,161,214,0.2)" rx="0.5"/>

  <!-- Bio line -->
  <text x="280" y="370" font-family="system-ui,-apple-system,sans-serif"
        font-size="20" fill="#8fa5c4" letter-spacing="0.01em">
    .NET Core · ASP.NET · React · SQL Server · Redis
  </text>

  <!-- Tech pills -->
  <g font-family="ui-monospace,monospace" font-size="14" font-weight="600">
    <!-- Enterprise -->
    <rect x="280" y="400" width="110" height="32" rx="8"
          fill="rgba(79,140,255,0.12)" stroke="rgba(79,140,255,0.3)" stroke-width="1"/>
    <text x="335" y="421" text-anchor="middle" fill="#8fc0ff">Enterprise</text>
    <!-- Full Stack -->
    <rect x="402" y="400" width="106" height="32" rx="8"
          fill="rgba(100,217,255,0.08)" stroke="rgba(100,217,255,0.25)" stroke-width="1"/>
    <text x="455" y="421" text-anchor="middle" fill="#64d9ff">Full Stack</text>
    <!-- Backend -->
    <rect x="520" y="400" width="90" height="32" rx="8"
          fill="rgba(52,211,153,0.08)" stroke="rgba(52,211,153,0.25)" stroke-width="1"/>
    <text x="565" y="421" text-anchor="middle" fill="#6ee7b7">Backend</text>
    <!-- India -->
    <rect x="622" y="400" width="130" height="32" rx="8"
          fill="rgba(27,54,91,0.4)" stroke="rgba(105,150,219,0.2)" stroke-width="1"/>
    <text x="687" y="421" text-anchor="middle" fill="#8fa3c1">West Bengal, India</text>
  </g>

  <!-- URL -->
  <text x="80" y="560" font-family="ui-monospace,monospace" font-size="18"
        fill="rgba(100,217,255,0.5)" letter-spacing="0.05em">gganguly.in</text>

  <!-- Right side accent dots -->
  <circle cx="1050" cy="200" r="3" fill="rgba(79,140,255,0.4)"/>
  <circle cx="1100" cy="150" r="2" fill="rgba(100,217,255,0.3)"/>
  <circle cx="1150" cy="280" r="4" fill="rgba(79,140,255,0.2)"/>
  <circle cx="1080" cy="380" r="2" fill="rgba(100,217,255,0.35)"/>
  <circle cx="1130" cy="450" r="3" fill="rgba(79,140,255,0.25)"/>
</svg>
